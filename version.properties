# Default version for :payload/:qr publishing (see .github/workflows/publish*.yml and
# README's Publishing section). major/minor/patch here is the *release* version used
# when publishing from main — a snapshot dispatch reads these same defaults unless it's
# given an explicit override, and an override gets written back here so it becomes the
# new default for the branch it ran on.
major=0
minor=1
patch=0
