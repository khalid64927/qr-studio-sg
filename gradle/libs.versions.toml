[versions]
kotlin = "2.2.20"
agp = "8.11.2"
compose = "1.9.1"
filekit = "0.8.0"
# Compose Multiplatform pulls 0.7.1 transitively and would upgrade anything lower, so
# this tracks it deliberately rather than being silently overridden. Note 0.7.x moved
# Clock to kotlin.time; kotlinx.datetime still owns LocalDate and friends.
kotlinx-datetime = "0.7.1"
qrcode-kotlin = "4.5.0"
emv-qrcode = "0.1.5"
zxing = "3.5.3"
# Must track the Compose Multiplatform version: lifecycle 2.11.0 pulls androidx compose
# runtime 1.11.x, which CMP 1.9.1 does not provide, and the app dies at first
# composition with "CompositionLocal LocalHostDefaultProvider not present".
lifecycle = "2.9.6"
coroutines = "1.10.2"
androidx-activity = "1.11.0"
android-compileSdk = "36"
android-minSdk = "26"
android-targetSdk = "36"

[libraries]
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
qrcode-kotlin = { module = "io.github.g0dkar:qrcode-kotlin", version.ref = "qrcode-kotlin" }
# JVM-test-only decoder for TC-03 render/decode round-trips. Never shipped in the app.
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
filekit-compose = { module = "io.github.vinceglb:filekit-compose", version.ref = "filekit" }

kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# Desktop has no Dispatchers.Main without this — viewModelScope.launch() throws
# IllegalStateException the moment any UI intent fires (e.g. the first keystroke).
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
# Same problem, same fix, on Android.
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
zxing-javase = { module = "com.google.zxing:javase", version.ref = "zxing" }

# JVM-test-only independent parser (TC-04). Never shipped in the app.
emv-qrcode = { module = "com.github.mvallim:emv-qrcode", version.ref = "emv-qrcode" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
