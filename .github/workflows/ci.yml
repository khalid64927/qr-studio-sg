# CD-01: build every target and run the test suites on each push and PR.
# A red build blocks merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheapest possible gate, runs before anything else compiles: formatting, Android
  # Lint, and a known-vulnerability scan of every dependency. A style nit or a stale
  # CVE should never be discovered only after the expensive jobs below have run.
  quality:
    name: Format, lint, dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless (ktlint) format check
        run: ./gradlew spotlessCheck --stacktrace
      - name: Android Lint
        run: ./gradlew :composeApp:lintDebug :ui:lintDebug :payload:lintDebug :qr:lintDebug --stacktrace
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '*/build/reports/lint-results-*.html'
      # Without this, every run re-downloads the entire NVD CVE database from scratch
      # (build.gradle.kts pins dependencyCheck's data directory to a fixed,
      # project-relative path specifically so it's cacheable here) — a cold sync can take
      # 30-90+ minutes even with an API key, since NVD's own rate limits apply regardless.
      # Restored by a prefix match so even a stale cache still turns a full download into
      # a fast incremental update; saved fresh under today's date so it stays current.
      - id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache dependency-check NVD database
        uses: actions/cache@v4
        with:
          path: .dependency-check-data
          key: dependency-check-data-${{ steps.date.outputs.date }}
          restore-keys: dependency-check-data-
      # Confirms whether the secret actually reached this job — never echoes the value
      # itself, only whether it's present/non-empty and its length, which is enough to
      # tell a genuinely-missing secret apart from dependency-check just not picking it
      # up for some other reason.
      - name: Check NVD_API_KEY is set
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY is set (length: ${#NVD_API_KEY})"
          else
            echo "::warning::NVD_API_KEY is NOT set — check the repo secret exists and is named exactly NVD_API_KEY"
          fi
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      # NVD_API_KEY is optional but strongly recommended: without it the NVD data feed
      # update is rate-limited hard enough to make this step flaky/slow. Get one free at
      # https://nvd.nist.gov/developers/request-an-api-key and add it as a repo secret.
      - name: OWASP dependency-check
        run: ./gradlew dependencyCheckAggregate --stacktrace
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.html

  # The payment-critical core. Runs first and cheapest: if the payload is wrong,
  # nothing else matters. Includes the TC-04 independent parser cross-check.
  payload:
    name: Payload (JVM tests + TC-04 cross-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # CD-08: keep build times reasonable.
      - uses: gradle/actions/setup-gradle@v4
      - name: Run payload tests
        run: ./gradlew :payload:jvmTest --stacktrace
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payload-test-report
          path: payload/build/reports/tests/

  # CD-01: Android, JVM and Wasm all compile from the one codebase.
  build:
    name: Build (Android / JVM / Wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android, JVM and Wasm targets
        run: |
          ./gradlew \
            :payload:compileDebugKotlinAndroid \
            :payload:compileReleaseKotlinAndroid \
            :payload:compileKotlinJvm \
            :payload:compileKotlinWasmJs \
            --stacktrace

  # CD-02: iOS is not distributed in v1, but it is compiled on every change so it
  # does not silently rot. macOS runners are free on public repositories.
  ios:
    name: iOS compile + Native tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile iOS targets
        run: |
          ./gradlew \
            :payload:compileKotlinIosArm64 \
            :payload:compileKotlinIosSimulatorArm64 \
            :payload:compileKotlinIosX64 \
            --stacktrace
      # Runs the shared commonTest suite on Kotlin/Native, not just the JVM, so a
      # platform-specific divergence in the payload builder cannot reach a release.
      - name: Run payload tests on Kotlin/Native
        run: ./gradlew :payload:iosSimulatorArm64Test --stacktrace
