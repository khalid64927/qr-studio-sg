# Publishes :payload and :qr as platform-native libraries — never :ui or :composeApp,
# which are Compose Multiplatform and not consumable by a native-UI app. See README's
# "Publishing" section.
#
# Triggered by pushing a `vX.Y.Z` tag, or manually via workflow_dispatch for a dry run
# against a version that hasn't been tagged yet. Nothing here ever pushes a commit back
# to this repository — the iOS job prints the XCFramework checksums it computes rather
# than writing them into Package.swift, because main only accepts changes via PR (see
# branch protection). Update Package.swift and open a PR after a release.
name: Publish Libraries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0, no leading 'v')"
        required: true

permissions:
  contents: write # to attach XCFramework zips to a GitHub Release
  packages: write # to publish to GitHub Packages (Maven + npm)

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  # Maven (AAR + JVM jar) and npm — the actual publish steps live in one place,
  # publish-artifacts.yml, shared with publish-snapshot.yml's manual branch snapshots.
  publish-artifacts:
    needs: version
    uses: ./.github/workflows/publish-artifacts.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  # XCFrameworks, for a native SwiftUI/UIKit app via SPM's binaryTarget. Uploaded to a
  # GitHub Release rather than a package registry — SPM binary distribution expects a
  # plain URL + checksum, not a registry package.
  publish-ios:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble XCFrameworks
        run: |
          ./gradlew \
            :payload:assemblePayNowPayloadKitReleaseXCFramework \
            :qr:assembleQrStudioQrKitReleaseXCFramework \
            -PlibraryVersion=${{ needs.version.outputs.version }} \
            --stacktrace
      - name: Zip and checksum
        id: zip
        run: |
          cd payload/build/XCFrameworks/release
          zip -r -X PayNowPayloadKit.xcframework.zip PayNowPayloadKit.xcframework
          cd -
          cd qr/build/XCFrameworks/release
          zip -r -X QrStudioQrKit.xcframework.zip QrStudioQrKit.xcframework
          cd -
          {
            echo "payload_checksum=$(swift package compute-checksum payload/build/XCFrameworks/release/PayNowPayloadKit.xcframework.zip)"
            echo "qr_checksum=$(swift package compute-checksum qr/build/XCFrameworks/release/QrStudioQrKit.xcframework.zip)"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: |
            payload/build/XCFrameworks/release/PayNowPayloadKit.xcframework.zip
            qr/build/XCFrameworks/release/QrStudioQrKit.xcframework.zip
      - name: Print checksums for Package.swift
        run: |
          echo "## Update Package.swift before this release is consumable via SPM" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`releaseVersion\`: \`${{ needs.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`PayNowPayloadKit\` checksum: \`${{ steps.zip.outputs.payload_checksum }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`QrStudioQrKit\` checksum: \`${{ steps.zip.outputs.qr_checksum }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow never pushes to main (branch protection requires a PR) — open one with these values." >> "$GITHUB_STEP_SUMMARY"
