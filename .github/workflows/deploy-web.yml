name: Build and Deploy Web App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Wasm production bundle
        run: ./gradlew :composeApp:wasmJsBrowserProductionWebpack --stacktrace

      - name: Prepare web app files
        run: |
          mkdir -p dist
          cp -r composeApp/build/kotlin-webpack/wasmJs/productionExecutable/* dist/
          cp composeApp/src/webMain/resources/index.html dist/
          ls -la dist/
          echo "Files in dist:"
          find dist -type f

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
