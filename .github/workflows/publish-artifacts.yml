# Reusable workflow: the actual Maven (AAR + JVM jar) and npm publish steps for
# :payload/:qr, parameterized on a version string. Called by publish.yml (real releases,
# tag-triggered) and publish-snapshot.yml (manual, branch snapshots) so the publish
# logic itself exists in exactly one place. Never triggered directly.
name: Publish Artifacts (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "Version string to publish under (e.g. 0.1.0 or 0.1.0-a3f9c21-SNAPSHOT)"
        required: true
        type: string

jobs:
  # Android AAR + plain JVM jar, for a native Android app or any JVM backend.
  publish-android-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish AAR + JVM jar to GitHub Packages
        run: |
          ./gradlew \
            :payload:publishAndroidReleasePublicationToGitHubPackagesRepository \
            :payload:publishJvmPublicationToGitHubPackagesRepository \
            :qr:publishAndroidReleasePublicationToGitHubPackagesRepository \
            :qr:publishJvmPublicationToGitHubPackagesRepository \
            -PlibraryVersion=${{ inputs.version }} \
            --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # npm packages, for a native web/React/Node UI. See payload's and qr's jsMain "js"
  # facades — the published .d.ts is hand-designed for JS/TS, not auto-derived from the
  # full Kotlin API.
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build npm packages
        run: |
          ./gradlew \
            :payload:jsNodeProductionLibraryDistribution \
            :qr:jsNodeProductionLibraryDistribution \
            -PlibraryVersion=${{ inputs.version }} \
            --stacktrace
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@khalid64927'
      - name: Publish @khalid64927/qr-studio-sg-payload
        working-directory: payload/build/dist/js/productionLibrary
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish @khalid64927/qr-studio-sg-qr
        working-directory: qr/build/dist/js/productionLibrary
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
